# Best measured run: four training ranks, effective batch eight.
# Requires the separate assistance-coverage export; it is not the published advanced.json.
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: false
flash_attn: sdpa
stage: sft
do_train: true
finetuning_type: full
use_dft_loss: false
use_trimsft_loss: false
use_prift_loss: false
use_gem_loss: false
use_asft_loss: false
disable_shuffling: false
dataset: advanced
dataset_dir: artifacts/datasets-assistance-coverage
template: qwen
cutoff_len: 16384
max_samples: 15000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 0
dataloader_drop_last: false
train_on_prompt: false
packing: false
output_dir: runs/reproduced-assistance-coverage
overwrite_output_dir: false
logging_steps: 1
save_strategy: steps
save_steps: 50
save_total_limit: 2
save_only_model: false
plot_loss: true
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-06
num_train_epochs: 3
max_steps: 5625
lr_scheduler_type: cosine
warmup_ratio: 0.0
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
ddp_timeout: 18000
average_tokens_across_devices: true
